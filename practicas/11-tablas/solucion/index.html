<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tablas y ordenación | Accesibilidad práctica</title>
    <link rel="stylesheet" href="../../../assets/base.css" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header>
      <a href="../../../index.html">Índice de prácticas</a>
      <h1>Tablas y ordenación</h1>
      <p class="notice">
        Solución de referencia didáctica. Completa también las comprobaciones manuales de
        la ficha.
      </p>
    </header>
    <main id="contenido">
      <div class="table-scroll">
        <table>
          <caption>
            Plazas disponibles por curso
          </caption>
          <thead>
            <tr>
              <th scope="col">Curso</th>
              <th id="plazas" scope="col" aria-sort="none">
                <button id="ordenar" type="button">Ordenar por plazas</button>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">HTML accesible</th>
              <td>12</td>
            </tr>
            <tr>
              <th scope="row">CSS accesible</th>
              <td>5</td>
            </tr>
            <tr>
              <th scope="row">JavaScript accesible</th>
              <td>8</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p id="orden" role="status"></p>
    </main>
    <footer>
      <p>Portal de formación ficticio · Ejercicio original de accesibilidad.</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
