<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inscripción y recuperación de errores | Accesibilidad práctica</title>
    <link rel="stylesheet" href="../../../assets/base.css" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header>
      <a href="../../../index.html">Índice de prácticas</a>
      <h1>Inscripción y recuperación de errores</h1>
      <p class="notice">
        Versión inicial con barreras intencionadas. Utilízala solo como ejercicio.
      </p>
    </header>
    <main id="contenido">
      <h2>Solicitud de plaza</h2>
      <form id="inscripcion" novalidate>
        <input id="nombre" placeholder="Nombre" /><input
          id="email"
          placeholder="Correo electrónico"
        />
        <p id="error"></p>
        <button>Enviar solicitud</button>
      </form>
    </main>
    <footer>
      <p>Portal de formación ficticio · Ejercicio original de accesibilidad.</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
